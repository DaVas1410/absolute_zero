[project]
name = "algoworks-rfp-frontend"
version = "0.1.0"
description = "Frontend (Streamlit) del PoC de RFP para Algoworks"
authors = [
    { name = "Juan Daniel Vasconez Vela", email = "juan.vasconezvela@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "responses",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
